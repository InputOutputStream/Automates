
        <!DOCTYPE html>
        <html>
        <head>
            <title>Automate Visualizer</title>
            <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.0/standalone/dist/vis-network.min.js"></script>
            <link href="https://cdn.tailwindcss.com/3.4.1" rel="stylesheet">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        </head>
        <body class="bg-gray-100">
            
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Automate Visualizer</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="#">Accueil</a></li>
                        <li class="nav-item"><a class="nav-link" href="#import">Importer</a></li>
                        <li class="nav-item"><a class="nav-link" href="#export">Exporter</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        
            <div class="container mx-auto p-4">
                
        <div class="row">
            <div class="col-md-8">
        <div id="visualisation-container" class="w-full h-[600px] bg-white rounded-lg shadow-lg p-4">
            <div id="canvas-principal" class="w-full h-3/4"></div>
            <div id="controles-visualisation" class="w-full h-1/4 flex justify-center items-center"></div>
        </div>
        </div>
            <div class="col-md-4">
        <ul class="nav nav-tabs" id="resultats-tabs" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="proprietes-tab" data-bs-toggle="tab" href="#proprietes" role="tab">Propriétés</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="tests-tab" data-bs-toggle="tab" href="#tests" role="tab">Tests</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="transformations-tab" data-bs-toggle="tab" href="#transformations" role="tab">Transformations</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="historique-tab" data-bs-toggle="tab" href="#historique" role="tab">Historique</a>
            </li>
        </ul>
        <div class="tab-content">
            <div class="tab-pane active" id="proprietes" role="tabpanel"></div>
            <div class="tab-pane" id="tests" role="tabpanel"></div>
            <div class="tab-pane" id="transformations" role="tabpanel"></div>
            <div class="tab-pane" id="historique" role="tabpanel"></div>
        </div>
        </div>
        </div>
        
            </div>
            
        <footer class="bg-dark text-white text-center p-3 mt-4">
            <p>&copy; 2025 Automate Visualizer</p>
        </footer>
        
            ['\n        <div class="modal fade" id="importModal" tabindex="-1">\n            <div class="modal-dialog">\n                <div class="modal-content">\n                    <div class="modal-header">\n                        <h5 class="modal-title">Importer</h5>\n                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>\n                    </div>\n                    <div class="modal-body">\n                        <input type="file" id="import-file" class="form-control">\n                    </div>\n                    <div class="modal-footer">\n                        <button type="button" class="btn btn-primary" onclick="importer()">Importer</button>\n                    </div>\n                </div>\n            </div>\n        </div>\n        ', '\n        <div class="modal fade" id="exportModal" tabindex="-1">\n            <div class="modal-dialog">\n                <div class="modal-content">\n                    <div class="modal-header">\n                        <h5 class="modal-title">Exporter</h5>\n                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>\n                    </div>\n                    <div class="modal-body">\n                        <select id="export-format" class="form-control">\n                            <option value="json">JSON</option>\n                            <option value="dot">DOT</option>\n                            <option value="latex">LaTeX</option>\n                        </select>\n                    </div>\n                    <div class="modal-footer">\n                        <button type="button" class="btn btn-primary" onclick="exporter()">Exporter</button>\n                    </div>\n                </div>\n            </div>\n        </div>\n        ']
            
        <style>
            body { font-family: Arial, sans-serif; }
            .highlight { background-color: yellow !important; }
        </style>
        
            
        <script>
            
        document.getElementById('zoom-in').addEventListener('click', () => network.moveTo({scale: network.getScale() * 1.1}));
        document.getElementById('zoom-out').addEventListener('click', () => network.moveTo({scale: network.getScale() / 1.1}));
        document.getElementById('reset-view').addEventListener('click', () => network.fit());
        document.getElementById('mode-visualisation').addEventListener('change', (e) => {
            const mode = e.target.value;
            document.getElementById('canvas-principal').style.display = mode === 'standard' ? 'block' : 'none';
            document.getElementById('canvas-comparaison-1').style.display = mode === 'comparaison' ? 'block' : 'none';
            document.getElementById('canvas-comparaison-2').style.display = mode === 'comparaison' ? 'block' : 'none';
        });
        
            
        const tabs = document.querySelectorAll('#resultats-tabs .nav-link');
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                tabs.forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.querySelector(tab.getAttribute('href')).classList.add('active');
            });
        });
        
        </script>
        
        </body>
        </html>
